name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Python syntax
        run: python -m compileall -q .

      - name: Frontend checks
        run: python tools/check_frontend.py

      - name: Lua 5.1 compatibility
        run: python tools/check_lua51.py

      - name: Rule checks
        run: python tools/check_rules.py

      - name: Backend tests
        run: python tests/python/test_backend.py

      - name: Lua tests and corpus gate
        env:
          BTWAF_CE_CORPUS_PER_FILE: "0"
          BTWAF_CE_CORPUS_GATE: "1"
        run: node tests/run.mjs

      - name: Build release zip
        run: |
          VERSION=$(python -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('wafcore/paths.py', encoding='utf-8').read()).group(1))")
          python tools/build_zip.py --version "$VERSION"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: btwaf-ce-package
          path: dist/btwaf_ce-*.zip
          if-no-files-found: error
