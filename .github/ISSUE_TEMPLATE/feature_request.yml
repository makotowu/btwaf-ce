name: Feature request
description: 提出功能或规则改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请说明要解决的问题，而不是只描述实现方式。
        安全漏洞请不要使用此模板。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便，或缺少什么能力
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望的交互/行为/规则
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 使用场景、误报/漏报样例、参考实现等（请脱敏）
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，并确认不是重复建议
          required: true
        - label: 我理解该项目不承诺具体拦截效果，且不建议生产环境使用
          required: true
