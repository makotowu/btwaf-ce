<script>
    /* 预览页自检：收集 JS 错误 / 未处理的 Promise 拒绝，显示在顶部工具栏，便于确认"打开无报错" */
    window.__previewErrors = [];
    (function () {
        // ResizeObserver loop 警告是浏览器布局抖动产生的良性提示，不算 JS 报错
        function benign(msg) { return /ResizeObserver loop/i.test(String(msg)); }
        function push(msg) {
            if (benign(msg)) return;
            window.__previewErrors.push(String(msg));
            var el = document.getElementById('pv-err');
            if (el) {
                el.textContent = 'JS 错误：' + window.__previewErrors.length;
                el.style.display = 'inline-block';
            }
            try { console.error('[preview] ' + msg); } catch (e) { }
        }
        window.addEventListener('error', function (e) {
            push((e && (e.message || (e.error && e.error.message))) || 'unknown error');
        });
        window.addEventListener('unhandledrejection', function (e) {
            var r = e && e.reason;
            push('unhandled rejection: ' + ((r && (r.message || r.msg)) || r));
        });
    })();
</script>

            { ip: '103.24.55.9', site: 'shop.example.com', reason: 'cc', time: NOW - 86400 * 4, expire: NOW - 86300, block_time: 300, area: '中国-香港', state: 'unbanned', unban_time: NOW - 86300 },
            { ip: '5.188.206.14', site: 'www.example.com', reason: 'attack', time: NOW - 86400 * 5, expire: NOW - 86300, block_time: 600, area: '荷兰-阿姆斯特丹', state: 'expired' }
        ];
    }

    /* ---------- 响应构造 ---------- */
    function paged(list, params) {
        var p = num(params.p, 1) || 1;
        var rows = num(params.rows, 20) || 20;
        var start = (p - 1) * rows;
        return { list: list.slice(start, start + rows), total: list.length, page: p, rows: rows };
    }
    function filterLogs(params) {
        return ATTACK_ROWS.filter(function (r) {
            if (params.date && dayStr(0) !== params.date) return false;
            if (params.site && r.site !== params.site) return false;
            if (params.ip && r.ip.indexOf(params.ip) < 0) return false;
            if (params.type && r.module !== params.type) return false;
            if (params.action && r.action !== params.action) return false;
            if (params.keyword) {
                var kw = String(params.keyword);
                var text = (r.uri + ' ' + (r.query || '') + ' ' + (r.snippet || ''));
                if (text.indexOf(kw) < 0) return false;
            }
            return true;
        });
    }

    function emptyResponse(method, params) {
        switch (method) {
            case 'get_attack_logs': return { list: [], total: 0, page: 1, rows: num(params.rows, 20), types: [] };
            case 'get_sites': return { list: [], total: 0, page: 1, rows: num(params.rows, 20) };
            case 'get_rules': return { list: [], total: 0, page: 1, rows: num(params.rows, 20), skipped: [] };
            case 'get_custom_rules': return { list: [], total: 0, page: 1, rows: num(params.rows, 20) };
            case 'get_block_list': return { list: [], total: 0, page: 1, rows: num(params.rows, 20) };
            case 'get_logs': return { list: [], total: 0, page: 1, rows: num(params.rows, 20) };
            case 'get_overview':
                return {
                    date: dayStr(0), stats: { blocks: 0, cc_blocks: 0, attack_ips: 0, sites_total: 0, sites_open: 0, requests: null },
                    trend: [], types: [], top_ips: [], top_urls: [], recent: []
                };
            case 'get_engine_status':
                return {
                    version: '1.0.0', ready: true, enabled: true, observe: false, sensitivity: 2,
                    nginx: { bin: '/www/server/nginx/sbin/nginx', lua: true, conf_exists: true, conf_ok: true, conf_hash_ok: true },
                    dirs: { data: true, logs: true, lua: true, writable: true },
                    rules: {
                        crs_version: '4.11.0', total: 0, by_src: { crs: 0, ce: 0, custom: 0 },
                        skipped: [], skipped_count: 0, generated_at: 0, index_ok: false
                    },
                    config_apply_at: 0, last_reload: 0, errors: [], perf: { requests: 0, hits: 0, avg_ms: 0 }
                };
            case 'get_plugin_config': return globalConfig(true);
            case 'get_lists': return { lists: emptyLists() };
            case 'check_env': return { items: ENV_ITEMS, repairable: true };
            default: return {};
        }
    }

    function makeResponse(method, params) {
        params = params || {};
        if (MODE === 'empty') return emptyResponse(method, params);

        switch (method) {
            case 'get_engine_status':
                return {
                    version: '1.0.0', ready: true, enabled: true, observe: false, sensitivity: 2,
                    nginx: { bin: '/www/server/nginx/sbin/nginx', lua: true, conf_exists: true, conf_ok: true, conf_hash_ok: true },
                    dirs: { data: true, logs: true, lua: true, writable: true },
                    rules: {
                        crs_version: '4.11.0', total: 1355,
                        by_src: { crs: 1187, ce: 168, custom: CUSTOM_RULES.length },
                        skipped: SKIPPED, skipped_count: SKIPPED.length,
                        generated_at: NOW - 86400, index_ok: true
                    },
                    config_apply_at: NOW - 300,
                    last_reload: NOW - 240,
                    errors: [{ time: NOW - 4800, msg: '规则文件 rules/crs/942_sqli.lua 中 2 条规则编译失败，已跳过（详见 build_report.md）' }],
                    perf: { requests: 128473, hits: 391, avg_ms: 0.42 }
                };

            case 'get_overview':
                return {
                    date: params.date || dayStr(0),
                    stats: { blocks: 128, cc_blocks: 31, attack_ips: 47, sites_total: 5, sites_open: 4, requests: 128473 },
                    trend: [
                        { date: dayStr(-6), blocks: 96, cc: 22 },
                        { date: dayStr(-5), blocks: 118, cc: 30 },
                        { date: dayStr(-4), blocks: 64, cc: 11 },
                        { date: dayStr(-3), blocks: 143, cc: 41 },
                        { date: dayStr(-2), blocks: 88, cc: 18 },
                        { date: dayStr(-1), blocks: 152, cc: 36 },
                        { date: dayStr(0), blocks: 128, cc: 31 }
                    ],
                    types: [
                        { name: 'SQL注入', module: 'sqli', count: 62 },
                        { name: '跨站脚本', module: 'xss', count: 34 },
                        { name: '命令执行', module: 'rce', count: 18 },
                        { name: '扫描器', module: 'scan', count: 9 },
                        { name: '文件包含', module: 'lfi', count: 5 }
                    ],
                    top_ips: [
                        { ip: '45.88.12.34', count: 42, area: '美国-加州' },
                        { ip: '103.24.55.9', count: 27, area: '中国-香港' },
                        { ip: '185.220.101.7', count: 19, area: '德国-黑森' },
                        { ip: '192.241.210.33', count: 12, area: '美国-纽约' },
                        { ip: '61.135.169.121', count: 7, area: '中国-北京' }
                    ],
                    top_urls: [
                        { uri: '/article.php', count: 38 },
                        { uri: '/search', count: 24 },
                        { uri: '/api/run', count: 16 },
                        { uri: '/.env', count: 11 },
                        { uri: '/admin/login', count: 8 }
                    ],
                    recent: ATTACK_ROWS.slice(0, 6)
                };

            case 'get_attack_logs': {
                var list = filterLogs(params);
                var pagedLogs = paged(list, params);
                pagedLogs.types = [
                    { module: 'sqli', name: 'SQL注入', count: 62 },
                    { module: 'xss', name: '跨站脚本', count: 34 },
                    { module: 'rce', name: '命令执行', count: 18 },
                    { module: 'scan', name: '扫描器', count: 9 }
                ];
                pagedLogs.limited = true;
                return pagedLogs;
            }

            case 'get_attack_stat':
                return {
                    types: [{ module: 'sqli', name: 'SQL注入', count: 62 }],
                    sites: [{ site: 'www.example.com', count: 88 }],
                    ips: [{ ip: '45.88.12.34', count: 42 }],
                    total: 128
                };

            case 'get_sites': {
                var sites = SITE_ROWS.filter(function (s) {
                    if (!params.keyword) return true;
                    var kw = String(params.keyword).toLowerCase();
                    return s.site_name.toLowerCase().indexOf(kw) >= 0 ||
                        (s.domains || []).join(',').toLowerCase().indexOf(kw) >= 0;
                });
                return paged(sites, params);
            }

            case 'sync_sites':
                return { sites: SITE_ROWS.length, hosts: 7 };

            case 'get_site_config': {
                var sn = params.site_name || 'www.example.com';
                var cfg = {
                    open: true, sensitivity: 2, observe: null,
                    modules: siteModules(2),
                    cc: { open: true, cycle: 60, limit: 150, block_time: 600, status: 444, url_cc: false },
                    attack_block: { open: null, cycle: 0, limit: 0, block_time: 0 },
                    cdn: { open: true, headers: ['cf-connecting-ip', 'x-real-ip'], trusted: ['172.16.0.0/12'] },
                    lists: clone(SITE_LISTS),
                    rule_exclude: { crs: ['crs-942110'], ce: [] },
                    disable_php_path: ['^/cache/', '^/config/', '^/runtime/'],
                    disable_ext: ['sql', 'bak', 'swp', 'git', 'env'],
                    upload_ext: ['php', 'php5', 'jsp', 'exe', 'sh'],
                    custom_rules: ['custom-2'],
                    update_time: NOW - 3600
                };
                return { site_name: sn, config: cfg, raw: clone(cfg), global: globalConfig(false) };
            }

            case 'save_site_config':
            case 'save_plugin_config':
            case 'save_modules':
                return { saved: true, apply_at: NOW };

            case 'set_site_open':
                return { updated: (JSON.parse(params.site_names || '[]')).length };

            case 'get_plugin_config':
                return globalConfig(false);

            case 'get_modules':
                return {
                    modules: { sqli: { open: true, tier: 1, total: 287, enabled: 280 } },
                    sensitivity_options: [1, 2, 3]
                };

            case 'get_lists':
                return { lists: params.scope === 'site' ? clone(SITE_LISTS) : clone(GLOBAL_LISTS) };

            case 'set_lists':
                return { saved: true, count: (JSON.parse(params.items || '[]')).length };

            case 'save_block_page':
                return { saved: true };

            case 'preview_block_page':
                return {
                    html: '<!DOCTYPE html><html><head><meta charset="utf-8"><title>已拦截</title></head>' +
                        '<body style="font-family:sans-serif;text-align:center;padding:80px 20px;background:#f7f7f7">' +
                        '<h1 style="color:#d93025">请求已被 宝塔WAF社区版 拦截</h1>' +
                        '<p>如有疑问请联系站点管理员。</p></body></html>',
                    intercepted: ['<script>', 'onerror=']
                };

            case 'get_rules': {
                var rules = RULES.filter(function (r) {
                    if (params.source && r.src !== params.source) return false;
                    if (params.module && r.module !== params.module) return false;
                    if (params.keyword) {
                        var kw = String(params.keyword).toLowerCase();
                        if ((r.id + ' ' + r.name).toLowerCase().indexOf(kw) < 0) return false;
                    }
                    return true;
                }).map(function (r) {
                    var copy = clone(r);
                    // 与后端约定一致：启用状态由 rule_exclude 推导
                    var ex = { crs: ['crs-942100', 'crs-941100'], ce: ['ce-scan-002'] };
                    copy.enabled = (ex[r.src] || []).indexOf(r.id) < 0;
                    return copy;
                });
                var res = paged(rules, params);
                res.skipped = SKIPPED;
                return res;
            }

            case 'set_rule_exclude':
                return { saved: true };

            case 'get_custom_rules': {
                var kws = params.keyword ? String(params.keyword).toLowerCase() : '';
                var customs = CUSTOM_RULES.filter(function (r) {
                    return !kws || ((r.id + ' ' + r.name).toLowerCase().indexOf(kws) >= 0);
                });
                return paged(customs, params);
            }

            case 'save_custom_rule': {
                var rule = JSON.parse(params.rule || '{}');
                return { id: rule.id || 'custom-' + (CUSTOM_RULES.length + 1), saved: true };
            }
            case 'del_custom_rule':
                return { deleted: 1 };

            case 'get_block_list': {
                var status = params.status || 'current';
                var rows = status === 'current' ? blockRows(false) : blockRows(true);
                if (params.site) rows = rows.filter(function (r) { return r.site === params.site; });
                return paged(rows, params);
            }
            case 'unban_ip':
            case 'unban_all':
                return { unbanned: 1 };

            case 'check_env':
                return { items: ENV_ITEMS, repairable: true };

            case 'repair_env':
                return { actions: ['restore conf', 'restore lua', 'nginx -t', 'reload nginx'], nginx_test: 'ok' };

            case 'get_logs':
                return paged(OP_LOGS, params);
            case 'clear_logs':
                return { cleared: true };

            case 'export_config':
                return { config: globalConfig(false), site: { 'www.example.com': { open: true } }, custom: { rules: CUSTOM_RULES }, exported_at: NOW };
            case 'import_config':
                return { imported: true };

            case 'run_selftest':
                return { blocked: true, status: 403, hits: HITS_SQLI, request_id: 'mock-selftest-1' };

            default:
                console.warn('[preview mock] 未实现的方法：' + method);
                return {};
        }
    }

    /* 整体替换 WafAPI.call（WafAPI.data 内部走 WafAPI.call，因此会被一并接管） */
    WafAPI.call = function (method, params, options) {
        if (MODE === 'fail') {
            var err = new Error('模拟接口异常（当前为「接口失败」预览模式）');
            err.__msgShown = false;
            return Promise.reject(err);
        }
        try {
            var data = makeResponse(method, params);
            return Promise.resolve({ status: true, msg: 'mock', data: clone(data) });
        } catch (e) {
            return Promise.reject(e);
        }
    };

    window.__WAF_PREVIEW__ = {
        setMode: function (m) { MODE = m; },
        getMode: function () { return MODE; }
    };
})();

/* ===== 预览工具栏（数据状态 / 视图跳转 / 窄屏 / 深色） ===== */
(function () {
    'use strict';

    var DARK_VARS = {
        '--el-bg-color': '#141414',
        '--el-bg-color-overlay': '#1d1e1f',
        '--el-bg-color-page': '#0a0a0a',
        '--el-fill-color': '#303030',
        '--el-fill-color-light': '#262727',
        '--el-fill-color-blank': '#141414',
        '--el-text-color-primary': '#e5eaf3',
        '--el-text-color-regular': '#cfd3dc',
        '--el-text-color-secondary': '#a3a6ad',
        '--el-text-color-placeholder': '#8d9095',
        '--el-border-color': '#4c4d4f',
        '--el-border-color-light': '#414243',
        '--el-border-color-lighter': '#363637',
        '--el-border-color-extra-light': '#2b2b2c',
        '--el-color-primary': '#409eff',
        '--el-color-success': '#67c23a',
        '--el-color-warning': '#e6a23c',
        '--el-color-danger': '#f56c6c',
        '--el-color-info': '#909399'
    };
    var dark = false;
    var narrow = false;

    function app() { return window.__btwafCeApp; }
    function reload() {
        var a = app();
        if (a && a.reloadAll) a.reloadAll();
    }

    Array.prototype.forEach.call(document.querySelectorAll('.pv-btn[data-mode]'), function (btn) {
        btn.addEventListener('click', function () {
            Array.prototype.forEach.call(document.querySelectorAll('.pv-btn[data-mode]'), function (b) { b.classList.remove('is-active'); });
            btn.classList.add('is-active');
            window.__WAF_PREVIEW__.setMode(btn.getAttribute('data-mode'));
            reload();
        });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.pv-btn[data-view]'), function (btn) {
        btn.addEventListener('click', function () {
            var a = app();
            if (a && a.switchView) a.switchView(btn.getAttribute('data-view'));
        });
    });

    document.getElementById('pv-dark').addEventListener('click', function () {
        var root = document.documentElement;
        dark = !dark;
        this.classList.toggle('is-active', dark);
        if (dark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            Object.keys(DARK_VARS).forEach(function (k) { root.style.setProperty(k, DARK_VARS[k]); });
        } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', '');
            Object.keys(DARK_VARS).forEach(function (k) { root.style.removeProperty(k); });
        }
        if (window.BTP && BTP.theme && BTP.theme.refresh) BTP.theme.refresh();
    });

    document.getElementById('pv-narrow').addEventListener('click', function () {
        narrow = !narrow;
        this.classList.toggle('is-active', narrow);
        document.documentElement.classList.toggle('waf-force-narrow', narrow);
        if (window.WafCharts) window.WafCharts.resizeAll();
    });

    /* 支持 URL 参数，便于自动化/截图验证：
       preview.html?mode=normal|empty|fail&dark=1&narrow=1&view=rules */
    (function initFromQuery() {
        var q = {};
        try {
            var s = String(window.location.search || '').replace(/^\?/, '');
            s.split('&').forEach(function (kv) {
                if (!kv) return;
                var i = kv.indexOf('=');
                q[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1));
            });
        } catch (e) { }
        if (q.mode) {
            var target = null;
            Array.prototype.forEach.call(document.querySelectorAll('.pv-btn[data-mode]'), function (b) {
                var on = b.getAttribute('data-mode') === q.mode;
                b.classList.toggle('is-active', on);
                if (on) target = b;
            });
            if (target) window.__WAF_PREVIEW__.setMode(q.mode);
        }
        if (q.dark === '1') document.getElementById('pv-dark').click();
        if (q.narrow === '1') document.getElementById('pv-narrow').click();
        if (q.view) {
            var tries = 0;
            var timer = setInterval(function () {
                var a = app();
                if ((a && a.switchView) || tries++ > 60) {
                    clearInterval(timer);
                    if (a && a.switchView) a.switchView(q.view);
                }
            }, 150);
        }
    })();
})();
