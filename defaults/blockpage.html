<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请求被拦截</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:#f7f8fa;color:#17221a;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
main{width:100%;max-width:420px;text-align:center}
.mark{width:40px;height:40px;display:block;margin:0 auto 18px}
h1{margin:0 0 12px;font-size:30px;line-height:1.3;letter-spacing:-.01em}
.lead{margin:0 0 8px;color:#4d5a52;font-size:15px;line-height:1.8}
.hint{margin:0;color:#7a857e;font-size:13.5px;line-height:1.8}
footer{margin-top:44px;color:#8b958f;font-size:12px;line-height:1.9}
footer span{display:block}
footer strong{color:#4d5a52;font-weight:600}
footer a{color:#20823a;text-decoration:none}
footer a:hover,footer a:focus{text-decoration:underline}
@media (max-width:480px){body{padding:24px 20px}h1{font-size:26px}}
@media (prefers-color-scheme:dark){
:root{color-scheme:dark}
body{background:#0e1411;color:#e7efe9}
.lead{color:#b6c2ba}.hint{color:#8e9b93}
footer{color:#8e9b93}
footer strong{color:#b6c2ba}
footer a{color:#4ade80}
}
</style>
</head>
<body>
<main>
<svg class="mark" viewBox="0 0 512 512" fill="none" aria-hidden="true">
<path d="M256 46 L407 117 V268 C407 364 345 424 256 467 C167 424 105 364 105 268 V117 Z" stroke="#20A53A" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
<text x="256" y="260" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="113" font-weight="800" letter-spacing="-6" fill="#20A53A">WAF</text>
<path d="M192 298 H320" stroke="#20A53A" stroke-width="9" stroke-linecap="round"/>
<text x="256" y="386" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="86" font-weight="700" fill="#20A53A">CE</text>
</svg>
<h1>请求被拦截</h1>
<p class="lead">当前请求触发了安全策略，已被拦截。</p>
<p class="hint">如属误拦截，请联系网站管理员。</p>
<footer>
<span>本站由 <strong>宝塔WAF社区版</strong> 提供安全防护</span>
<a href="https://github.com/makotowu/btwaf-ce" target="_blank" rel="noopener noreferrer">github.com/makotowu/btwaf-ce ↗</a>
</footer>
</main>
</body>
</html>
